[project]
name = "mall-service"
version = "0.1.0"
description = "Mall catalog HTTP service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
mall-service = "mall_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mall_service"]
