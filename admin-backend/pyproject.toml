[project]
name = "admin-backend"
version = "0.1.0"
description = "Internal admin API for niub-shangcheng"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
admin-backend = "admin_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_backend"]
